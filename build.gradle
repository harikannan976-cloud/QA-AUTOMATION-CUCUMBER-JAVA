plugins {
    id 'java'
}

group = 'com.demo'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    test {
        resources {
            srcDir 'src/test/resources'
        }
    }
}

tasks.withType(ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    testImplementation 'io.cucumber:cucumber-java:7.18.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.1'
    testImplementation 'io.cucumber:cucumber-picocontainer:7.18.1'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'

    testImplementation 'org.seleniumhq.selenium:selenium-java:4.23.1'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.4.0'
    testImplementation 'io.appium:java-client:9.2.3'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'

    testImplementation 'org.slf4j:slf4j-simple:2.0.13'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperties System.getProperties()

    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.register('webTest', Test) {
    useJUnitPlatform()
    systemProperty 'cucumber.filter.tags', '@web'
    include '**/CucumberTestRunner.class'
}

tasks.register('apiTest', Test) {
    useJUnitPlatform()
    systemProperty 'cucumber.filter.tags', '@api'
}

tasks.register('mobileTest', Test) {
    useJUnitPlatform()
    systemProperty 'cucumber.filter.tags', '@mobile'
}

tasks.register('cucumberHtmlReport') {
    doLast {
        println('Cucumber HTML report is available at build/reports/cucumber/html/index.html')
    }
}
